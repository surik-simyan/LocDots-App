[versions]
agp = "8.10.1"
kotlin = "2.1.21"
compose = "1.8.2"
compose-material3 = "1.7.8"
compose-material3-android = "1.3.2"
androidx-activityCompose = "1.10.1"
skie = "0.10.2"
serialization = "1.8.1"
datetime = "0.6.2"
ktor = "3.1.3"
buildkonfig = "0.15.2"
